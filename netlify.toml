[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for hashed assets; HTML stays revalidated.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# /lead-generation.html is a file, like every other page. Pretty URLs 301s
# /lead-generation/ to /lead-generation. Do not force that slash URL to 200.
# /index.html is the homepage file and is not covered by Pretty URLs.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/advisory/lead-generation"
  to = "/lead-generation"
  status = 301
  force = true

[[redirects]]
  from = "/advisory/lead-generation/"
  to = "/lead-generation"
  status = 301
  force = true

# Wave 1 + Wave 2 demote: hard 301 /advisory/digital-growth → /digital-engine
# (with and without trailing slash). Do not compete with /digital-engine titles.
[[redirects]]
  from = "/advisory/digital-growth"
  to = "/digital-engine"
  status = 301
  force = true

[[redirects]]
  from = "/advisory/digital-growth/"
  to = "/digital-engine"
  status = 301
  force = true
